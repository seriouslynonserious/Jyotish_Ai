services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - backend
  backend:
    build: ./backend
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      APP_ALLOWED_ORIGIN: ${APP_ALLOWED_ORIGIN:-http://localhost:8088}
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:0.11.10
    volumes:
      - ollama-data:/root/.ollama
volumes:
  ollama-data:
