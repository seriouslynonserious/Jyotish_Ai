<aside>
  <a class="brand" href="/">✦ <span>Jyotish AI</span></a>
  <button class="new-chat" (click)="newChat.emit()">
    <span>＋</span> New Chat <span class="edit">↗</span>
  </button>
  <div class="history">
    <h2>RECENT <span>DEMO</span></h2>
    @for (chat of recentChats; track chat) {
      <p><span>◷</span> {{ chat }}</p>
    }
  </div>
  <div class="sidebar-bottom">
    <div class="note">
      <span>✧</span><strong>A little clarity, every day.</strong>
      <p>A space for your questions<br />and possibilities.</p>
    </div>
    <details>
      <summary>⚙ &nbsp; Settings</summary>
      <p>Phase 1 preview. Chats stay in memory and reset when you refresh.</p>
    </details>
    <div class="profile">
      <span class="avatar">Y</span>
      <div>Your space<small>Local preview</small></div>
      <span class="status"></span>
    </div>
  </div>
</aside>
