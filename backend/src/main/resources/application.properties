server.port=${PORT:8080}
ollama.url=${OLLAMA_URL:http://127.0.0.1:11434}
ollama.model=${OLLAMA_MODEL:llama3.2:3b}
# One complete reply per request; bounded wait and generation size.
ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:90}
app.allowed-origin=${APP_ALLOWED_ORIGIN:http://localhost:4200}
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
